<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"  >
        <title>Dynamic Resume builder</title> 
        <link rel="Stylesheet" href="style.css">
    </head>
    <body>
   <h1>Dynamic Resume Builder</h1>

<div class="form-container">
    <form>
        <fieldset>
      <legend>Persnol Information</legend>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
      
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
      

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      </fieldset>
    <fieldset>
        <legend>Education</legend>
        <label for="education">Education:</label>
        <textarea id="education" placeholder="Enter Your Education" rows="3" required></textarea>
     </fieldset>
        <fieldset>
        <legend>Experience</legend>
        <label for="education">Experience:</label>
        <textarea id="experience" placeholder="Enter Your Experience" rows="3" required></textarea>
    </fieldset>
        <button type="submit">Generate Resume</button>

    </form>
    </div>
    
  <br>

  <div id="resume-display">

  </div>

  <script src="app.js"></script>
    </body>
    </html>
